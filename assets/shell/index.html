<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrismaUI CEF Shell</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        .cef-shell-marker {
            position: fixed;
            top: 80px;
            left: 80px;
            z-index: 999999;
            padding: 24px 32px;
            color: white;
            background: rgba(220, 32, 32, 0.9);
            font: 48px Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="cef-shell-marker">CEF shell rendering</div>
    <script>
        console.info("PrismaUI CEF lifecycle shell loaded");
    </script>
</body>
</html>
