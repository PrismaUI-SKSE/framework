<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrismaUI Echo View 2</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: Arial, sans-serif;
            color: #f5f5f5;
        }

        #panel {
            position: absolute;
            left: 432px;
            top: 236px;
            width: 360px;
            padding: 16px 20px;
            border: 1px solid rgba(160, 224, 128, 0.85);
            border-radius: 8px;
            background: rgba(8, 22, 10, 0.84);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        label,
        input,
        output {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        input {
            margin-top: 6px;
            padding: 8px 10px;
            border: 1px solid rgba(160, 224, 128, 0.7);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.45);
            color: #f5f5f5;
            font: inherit;
        }

        button {
            margin-top: 12px;
            padding: 8px 10px;
            border: 1px solid rgba(160, 224, 128, 0.7);
            border-radius: 4px;
            background: rgba(36, 72, 24, 0.92);
            color: #f5f5f5;
            cursor: pointer;
            font: inherit;
        }

        button:hover,
        button:focus {
            background: rgba(54, 110, 36, 0.96);
            outline: none;
        }

        output {
            min-height: 22px;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.35);
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <main id="panel">
        <h1>Echo view 2</h1>
        <label for="echo-input">Text box</label>
        <input id="echo-input" type="text" value="View 2 text">
        <output id="echo-output" for="echo-input"></output>
        <button id="return-focus" type="button">Return focus</button>
    </main>

    <script src="prismaui_echo_view.js"></script>
</body>
</html>
