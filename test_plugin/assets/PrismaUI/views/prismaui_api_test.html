<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrismaUI API Test</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: Arial, sans-serif;
            color: #f5f5f5;
        }

        #panel {
            position: absolute;
            left: 32px;
            top: 32px;
            min-width: 420px;
            padding: 16px 20px;
            border: 1px solid rgba(128, 200, 255, 0.85);
            border-radius: 8px;
            background: rgba(8, 12, 20, 0.84);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        p {
            margin: 6px 0;
        }

        code {
            color: #90ee90;
        }
    </style>
</head>
<body>
    <main id="panel">
        <h1>PrismaUI API Test</h1>
        <p>Status: <code id="status">loading</code></p>
        <p>Native callbacks and console events are written to <code>PrismaUITest.log</code>.</p>
    </main>

    <script>
        (function () {
            const status = document.getElementById('status');

            function setStatus(value) {
                status.textContent = value;
                console.info('[PrismaUITest] status=' + value);
            }

            window.prismaApiTestFunction = function (payload) {
                console.log('[PrismaUITest] InteropCall payload=' + payload);
                setStatus('interop:' + payload);
                if (typeof window.prismaApiTestEcho === 'function') {
                    window.prismaApiTestEcho('listener-payload-from-interop:' + payload);
                }
                return 'interop-result:' + payload;
            };

            window.addEventListener('DOMContentLoaded', function () {
                setStatus('dom-content-loaded');
                console.warn('[PrismaUITest] warning-level console callback probe');
            });
        })();
    </script>
</body>
</html>
