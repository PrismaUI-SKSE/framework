; PrismaUI 3D Model Preview — ships to Data/SKSE/Plugins/
; Missing file = these defaults.
[General]
; Master switch. 0 disables the feature entirely (JS API not exposed).
bEnabled=1
; Render target resolution (square), 128-2048.
iRTSize=512
; Auto-spin speed in degrees per second.
iSpinDegPerSec=45
; Debug: dump the render target to PrismaUI_ModelPreview_dump.bmp once per item.
bDumpRT=0
