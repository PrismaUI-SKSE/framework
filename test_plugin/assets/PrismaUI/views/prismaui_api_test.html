<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrismaUI API Test</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: Arial, sans-serif;
            color: #f5f5f5;
        }

        #panel {
            position: absolute;
            left: 32px;
            top: 32px;
            min-width: 420px;
            padding: 16px 20px;
            border: 1px solid rgba(128, 200, 255, 0.85);
            border-radius: 8px;
            background: rgba(8, 12, 20, 0.84);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 14px;
        }

        button {
            padding: 8px 10px;
            border: 1px solid rgba(128, 200, 255, 0.75);
            border-radius: 4px;
            background: rgba(24, 44, 72, 0.92);
            color: #f5f5f5;
            cursor: pointer;
            font: inherit;
        }

        button:hover,
        button:focus {
            background: rgba(42, 76, 122, 0.96);
            outline: none;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        p {
            margin: 6px 0;
        }

        code {
            color: #90ee90;
        }

        .corner-marker {
            position: fixed;
            width: 100px;
            height: 100px;
            background: #00c000;
            pointer-events: none;
        }

        .corner-marker.top-left {
            left: 0;
            top: 0;
        }

        .corner-marker.top-right {
            right: 0;
            top: 0;
        }

        .corner-marker.bottom-left {
            left: 0;
            bottom: 0;
        }

        .corner-marker.bottom-right {
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div class="corner-marker top-left"></div>
    <div class="corner-marker top-right"></div>
    <div class="corner-marker bottom-left"></div>
    <div class="corner-marker bottom-right"></div>
    <main id="panel">
        <h1>PrismaUI API Test</h1>
        <p>Status: <code id="status">loading</code></p>
        <p>Native callbacks and console events are written to <code>PrismaUITest.log</code>.</p>
        <div class="controls" aria-label="Echo view controls">
            <button type="button" data-command="focus:1">Focus echo view 1</button>
            <button type="button" data-command="focus:2">Focus echo view 2</button>
            <button type="button" data-command="visibility:1">Toggle echo view 1</button>
            <button type="button" data-command="visibility:2">Toggle echo view 2</button>
            <button type="button" data-command="unfocus:main">Unfocus this view</button>
        </div>
    </main>

    <script>
        (function () {
            const status = document.getElementById('status');

            function setStatus(value) {
                status.textContent = value;
                console.info('[PrismaUITest] status=' + value);
            }

            window.prismaApiTestFunction = function (payload) {
                console.log('[PrismaUITest] InteropCall payload=' + payload);
                setStatus('interop:' + payload);
                if (typeof window.prismaApiTestEcho === 'function') {
                    window.prismaApiTestEcho('listener-payload-from-interop:' + payload);
                }
                return 'interop-result:' + payload;
            };

            document.querySelectorAll('button[data-command]').forEach(function (button) {
                button.addEventListener('click', function () {
                    const command = button.getAttribute('data-command');
                    setStatus('control:' + command);
                    if (typeof window.prismaApiTestControl === 'function') {
                        window.prismaApiTestControl(command);
                    } else {
                        console.warn('[PrismaUITest] prismaApiTestControl listener is unavailable');
                    }
                });
            });

            window.addEventListener('DOMContentLoaded', function () {
                setStatus('dom-content-loaded');
                console.warn('[PrismaUITest] warning-level console callback probe');
            });
        })();
    </script>
</body>
</html>
