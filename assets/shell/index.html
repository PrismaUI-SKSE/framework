<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrismaUI CEF Shell</title>
    <style>
        html,
        body,
        #prisma-root {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #prisma-root {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .prisma-view-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color-scheme: normal;
        }

        .prisma-view-frame[data-hidden="true"] {
            visibility: hidden;
            pointer-events: none;
        }

        .prisma-view-frame[data-hidden="false"] {
            visibility: visible;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="prisma-root" aria-hidden="true"></div>
    <script>
        (() => {
            "use strict";

            const root = document.getElementById("prisma-root");
            const views = new Map();

            function normalizeId(id) {
                if (typeof id === "bigint") {
                    return id.toString(10);
                }
                if (typeof id === "number" && Number.isSafeInteger(id) && id >= 0) {
                    return String(id);
                }
                if (typeof id === "string" && /^\d+$/.test(id)) {
                    return id;
                }
                throw new TypeError(`Invalid Prisma view id: ${id}`);
            }

            function iframeName(id) {
                return `prisma-view-${id}`;
            }

            function setHiddenState(frame, id, hidden) {
                const isHidden = Boolean(hidden);
                frame.dataset.hidden = isHidden ? "true" : "false";
                frame.hidden = isHidden;
                frame.style.pointerEvents = isHidden ? "none" : "auto";
                console.info("PrismaUI shell set hidden", { id, iframe: frame.name, hidden: isHidden, url: frame.src });
            }

            function getFrame(id) {
                const key = normalizeId(id);
                const frame = views.get(key);
                if (!frame) {
                    console.warn("PrismaUI shell command ignored missing iframe", { id: key, iframe: iframeName(key) });
                }
                return frame;
            }

            function installFrameEvents(frame, id) {
                frame.addEventListener("load", () => {
                    console.info("PrismaUI shell iframe load", { id, iframe: frame.name, url: frame.src });
                });
                frame.addEventListener("error", () => {
                    console.error("PrismaUI shell iframe error", { id, iframe: frame.name, url: frame.src });
                });
            }

            window.__prismaShell = Object.freeze({
                createView(options) {
                    if (!options || typeof options !== "object") {
                        throw new TypeError("createView requires an options object");
                    }

                    const id = normalizeId(options.id);
                    const name = iframeName(id);
                    const url = String(options.url ?? "about:blank");
                    const order = Number.isFinite(Number(options.order)) ? Math.trunc(Number(options.order)) : 0;
                    const hidden = Boolean(options.hidden);
                    let frame = views.get(id);

                    if (!frame) {
                        frame = document.createElement("iframe");
                        frame.className = "prisma-view-frame";
                        frame.id = name;
                        frame.name = name;
                        frame.dataset.prismaViewId = id;
                        frame.allow = "clipboard-read; clipboard-write";
                        frame.setAttribute("allowtransparency", "true");
                        installFrameEvents(frame, id);
                        views.set(id, frame);
                        console.info("PrismaUI shell iframe created", { id, iframe: name, url, order, hidden });
                    } else {
                        console.info("PrismaUI shell iframe updated", { id, iframe: name, url, order, hidden });
                    }

                    frame.style.zIndex = String(order);
                    frame.dataset.order = String(order);
                    setHiddenState(frame, id, hidden);
                    if (frame.getAttribute("src") !== url) {
                        frame.setAttribute("src", url);
                        root.appendChild(frame);
                    }
                    return true;
                },

                destroyView(id) {
                    const key = normalizeId(id);
                    const frame = views.get(key);
                    if (!frame) {
                        console.info("PrismaUI shell destroy ignored missing iframe", { id: key, iframe: iframeName(key) });
                        return false;
                    }

                    const url = frame.src;
                    frame.remove();
                    views.delete(key);
                    console.info("PrismaUI shell iframe destroyed", { id: key, iframe: iframeName(key), url });
                    return true;
                },

                setHidden(id, hidden) {
                    const key = normalizeId(id);
                    const frame = getFrame(key);
                    if (!frame) {
                        return false;
                    }
                    setHiddenState(frame, key, hidden);
                    return true;
                },

                setOrder(id, order) {
                    const key = normalizeId(id);
                    const frame = getFrame(key);
                    if (!frame) {
                        return false;
                    }
                    const zIndex = Number.isFinite(Number(order)) ? Math.trunc(Number(order)) : 0;
                    frame.style.zIndex = String(zIndex);
                    frame.dataset.order = String(zIndex);
                    console.info("PrismaUI shell set order", { id: key, iframe: frame.name, order: zIndex, url: frame.src });
                    return true;
                },

                focusView(id) {
                    const key = normalizeId(id);
                    const frame = getFrame(key);
                    if (!frame) {
                        return false;
                    }
                    frame.focus();
                    console.info("PrismaUI shell iframe focused", { id: key, iframe: frame.name, url: frame.src });
                    return true;
                },

                blurView(id) {
                    const key = normalizeId(id);
                    const frame = getFrame(key);
                    if (!frame) {
                        return false;
                    }
                    if (document.activeElement === frame) {
                        frame.blur();
                    }
                    console.info("PrismaUI shell iframe blurred", { id: key, iframe: frame.name, url: frame.src });
                    return true;
                }
            });

            console.info("PrismaUI CEF shell loaded");
        })();
    </script>
</body>
</html>
